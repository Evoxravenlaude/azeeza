<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Azeeza Omipidan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<style>
:root{--paper:#E4DED5;--ink:#171513;--muted:#514C45;--rose:#DDA39B}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px;background:var(--paper);color:var(--ink);font-family:"Archivo",Arial,sans-serif;text-align:center}
.code{display:flex;align-items:center;gap:.06em;font-stretch:68%;font-weight:800;font-size:min(34vw,280px);line-height:.86}
.code i{font-style:normal;font-weight:500}
.dot{width:.5em;height:.66em;border-radius:6px;background:var(--rose)}
p{margin:0;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(24px,3vw,38px);line-height:1.1;max-width:22ch}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border:1px solid var(--ink);border-radius:999px;color:inherit;text-decoration:none;font-family:"Geist Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
a:hover{background:var(--ink);color:var(--paper)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div class="code" aria-hidden="true">4<i>(</i><span class="dot"></span><i>)</i>4</div>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Page not found</h1>
<p>This page doesn't exist. The portfolio is one click away.</p>
<a href="/">Back to the portfolio</a>
</body>
</html>
